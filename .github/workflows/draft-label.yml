name: Draft PR Labeler

# Reusable workflow. Each repo calls it from a small workflow on pull_request_target.
# Safe: no checkout, only PR metadata from the caller's event payload is used.
on:
  workflow_call:

permissions:
  pull-requests: write

jobs:
  update-draft-label:
    runs-on: ubuntu-latest
    # One run at a time per PR, so a queued run cannot act on stale state.
    concurrency:
      group: draft-label-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const labelName = '🚧 Draft/WIP';
            // Read current state, not the event payload, which may be stale by now.
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number });
            const hasLabel = pr.labels.some(label => label.name === labelName);
            const params = { ...context.repo, issue_number: pr.number };

            if (pr.draft && !hasLabel) {
              await github.rest.issues.addLabels({ ...params, labels: [labelName] });
            } else if (!pr.draft && hasLabel) {
              await github.rest.issues.removeLabel({ ...params, name: labelName });
            }
